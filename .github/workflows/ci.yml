name: Phase 6 CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      AUTH_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      POSTGRES_PASSWORD: ci-only-password
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      ORCHESTRATOR_API_KEYS: '{"ci-admin-key-which-is-long-enough-123456":"ci-admin:admin","ci-dev-key-which-is-long-enough-123456":"ci-team:developer","ci-review-key-which-is-long-enough-123456":"ci-team:reviewer"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install orchestrator dependencies
        run: python -m pip install -r orchestrator/requirements.txt pyyaml
      - name: Validate Python and focused unit tests
        run: python scripts/validate_project.py
      - name: Run Spring Boot tests
        run: mvn -B -ntp -f backend/pom.xml test
      - name: Validate Docker Compose
        run: |
          mkdir -p monitoring
          printf '%s' 'ci-admin-key-which-is-long-enough-123456' > monitoring/metrics_token
          docker compose config --quiet
      - name: Build backend and orchestrator images
        run: docker compose build backend orchestrator
      - name: Start infrastructure and application services
        env:
          DATABASE_URL: postgresql+psycopg://app:ci-only-password@localhost:5432/shortener
          REDIS_URL: redis://localhost:6379/1
          AGENT_WORKSPACE_ROOT: ${{ github.workspace }}/.agentic-workspaces
          MAVEN_CACHE: ${{ runner.temp }}/m2-cache
        run: |
          mkdir -p "$MAVEN_CACHE"
          docker compose up -d postgres redis backend prometheus grafana
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://localhost:8080/actuator/health
      - name: Warm isolated Maven test cache
        env:
          MAVEN_CACHE: ${{ runner.temp }}/m2-cache
        run: python scripts/warm_maven_cache.py
      - name: Start host orchestrator
        env:
          DATABASE_URL: postgresql+psycopg://app:ci-only-password@localhost:5432/shortener
          REDIS_URL: redis://localhost:6379/1
          AGENT_WORKSPACE_ROOT: ${{ github.workspace }}/.agentic-workspaces
          MAVEN_CACHE: ${{ runner.temp }}/m2-cache
        run: |
          nohup python -m uvicorn app.main:app --app-dir orchestrator --host 0.0.0.0 --port 8000 > orchestrator.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/ready >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/ready
      - name: End-to-end smoke test including human approval and sandbox QA
        env:
          DATABASE_URL: postgresql+psycopg://app:ci-only-password@localhost:5432/shortener
          REDIS_URL: redis://localhost:6379/1
          AGENT_WORKSPACE_ROOT: ${{ github.workspace }}/.agentic-workspaces
          MAVEN_CACHE: ${{ runner.temp }}/m2-cache
        run: python scripts/smoke_test.py --workflow --workflow-timeout 900
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose logs --no-color || true
          tail -n 250 orchestrator.log || true
      - name: Stop Compose services
        if: always()
        run: docker compose down -v
