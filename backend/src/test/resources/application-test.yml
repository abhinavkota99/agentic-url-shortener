spring:
  datasource:
    url: jdbc:h2:mem:shortener_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
management:
  health:
    redis:
      enabled: false
